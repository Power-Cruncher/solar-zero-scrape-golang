version: "3.9"

services:
  solar-zero-scrape:
    image: ghcr.io/power-cruncher/solar-zero-scrape-golang:latest
    container_name: solarzero
    volumes:
      - /volume1/docker/solar-zero-scrape:/config
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2025-11-15
    restart: always
    ports:
      - 1883:1883
      - 1884:1884
    volumes:
      - /volume1/docker/solar-zero-scrape/mqtt-config:/mosquitto/config
      - /volume1/docker/solar-zero-scrape/mqtt-data:/mosquitto/data
      - /volume1/docker/solar-zero-scrape/mqtt-log:/mosquitto/log